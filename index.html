<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        textarea{
            width: 250px;
            height: 100px;
        }
    </style>
    <title>Document</title>
</head>
<body>
    <form id="formzinho" method="POST">
        <textarea name="" id="mensagem" required></textarea>
        <input type="submit" value="enviar">
        <textarea name="" disabled id="respostaIa"></textarea>
    </form>
    <script>
        const historico = [];

        document.getElementById('formzinho').addEventListener('submit', async (e) => {
            e.preventDefault();

            const campo = document.getElementById('mensagem');
            const respostaIa = document.getElementById('respostaIa');
            const mensagem = campo.value.trim();

            if (!mensagem) return;

            historico.push({
                role: 'user',
                content: mensagem
            });

            respostaIa.value = 'Pensando...';

            try {
                const resposta = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: historico
                    })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(dados.error || 'Erro ao consultar a IA.');
                }

                respostaIa.value = dados.content;

                historico.push({
                    role: 'assistant',
                    content: dados.content
                });

                campo.value = '';

            } catch (erro) {
                console.error(erro);
                respostaIa.value = 'Erro ao obter resposta. Verifique o terminal do servidor.';
                historico.pop();
            }
        });
    </script>
</body>
</html>
